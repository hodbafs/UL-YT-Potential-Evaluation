    // Score calculation
    function calculateScore(scores = {}) {
      let rawScore = 0;
      let answeredCount = 0;
      for (let i = 1; i <= 12; i++) {
        const val = Number(scores[`q${i}`]);
        if (val && val >= 1 && val <= 5) {
          rawScore += val;
          answeredCount++;
        }
      }

      const percentage = answeredCount > 0 ? Number(((rawScore / 60) * 100).toFixed(2)) : 0;
      let potentialTier = 'Low Potential';
      let tierColor = 'text-slate-300 bg-slate-800/80 border-slate-600';
      if (percentage >= 80) {
        potentialTier = 'High Potential (Talent Pool)';
        tierColor = 'text-amber-300 bg-amber-500/20 border-amber-400/50';
      } else if (percentage >= 60) {
        potentialTier = 'Medium Potential (Promising)';
        tierColor = 'text-blue-300 bg-blue-500/20 border-blue-400/50';
      }

      const dimScores = {
        dim1: (Number(scores.q1 || 0) + Number(scores.q2 || 0) + Number(scores.q3 || 0)) / 3,
        dim2: (Number(scores.q4 || 0) + Number(scores.q5 || 0) + Number(scores.q6 || 0)) / 3,
        dim3: (Number(scores.q7 || 0) + Number(scores.q8 || 0) + Number(scores.q9 || 0)) / 3,
        dim4: (Number(scores.q10 || 0) + Number(scores.q11 || 0) + Number(scores.q12 || 0)) / 3
      };

      return {
        rawScore,
        maxScore: 60,
        percentage,
        potentialTier,
        tierColor,
        answeredCount,
        isComplete: answeredCount === 12,
        dimScores
      };
    }

    // ==========================================
    // 5. OFFICIAL GOOGLE APPS SCRIPT WEBHOOK CONFIG
    // ==========================================
    const DEFAULT_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbzdkvVUcupc6Z9W1O-ltyZuUGWe0WaoYJ5mSID6ER7R2gP388Z_Y7Q_jsjngvCPp12y/exec';

    // ==========================================
    // 6. MAIN APPLICATION COMPONENT
    // ==========================================
    function App() {
      // Current Authenticated User State
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('bafs_talent_user');
        return saved ? JSON.parse(saved) : null;
      });

      // Login Inputs
      const [emailInput, setEmailInput] = useState('');
      const [passwordInput, setPasswordInput] = useState('');
      const [loginError, setLoginError] = useState('');

      // Evaluations Database in LocalStorage
      const [evaluations, setEvaluations] = useState(() => {
        const saved = localStorage.getItem('bafs_evaluations_db');
        return saved ? JSON.parse(saved) : {};
      });

      // Hero Carousel Index
      const [selectedHeroIndex, setSelectedHeroIndex] = useState(0);

      // Active Evaluation Modal Candidate
      const [evaluatingCandidate, setEvaluatingCandidate] = useState(null);

      // Admin Candidate Detail Modal
      const [adminDetailCandidate, setAdminDetailCandidate] = useState(null);

      // Admin View Mode: 'cinema' or 'matrix'
      const [adminViewMode, setAdminViewMode] = useState('cinema');

      // Webhook URL (Fixed to official Google Apps Script deployment)
      const webhookUrl = DEFAULT_WEBHOOK_URL;
      const [isSyncing, setIsSyncing] = useState(false);
      const [lastSyncedAt, setLastSyncedAt] = useState(null);

      // Toast feedback
      const [toastMessage, setToastMessage] = useState(null);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      // In-flight submissions tracker (anti-race condition during background sync)
      const pendingSubmissionsRef = useRef({});

      // Cross-tab broadcast channel for immediate multi-tab synchronization on the same device
      const syncChannelRef = useRef(null);

      useEffect(() => {
        try {
          syncChannelRef.current = new BroadcastChannel('bafs_talent_sync');
          syncChannelRef.current.onmessage = (event) => {
            if (event.data?.type === 'RESET_ALL') {
              setEvaluations({});
              localStorage.removeItem('bafs_evaluations_db');
              showToast('ข้อมูลถูกรีเซ็ตจากแท็บแอดมิน');
            } else if (event.data?.type === 'RESET_SINGLE') {
              const candId = event.data.candidateId;
              setEvaluations((prev) => {
                const updated = { ...prev };
                delete updated[candId];
                Object.keys(updated).forEach((k) => {
                  if (k.endsWith(`_${candId}`)) delete updated[k];
                });
                localStorage.setItem('bafs_evaluations_db', JSON.stringify(updated));
                return updated;
              });
              showToast(`ปลดล็อคการประเมิน (${candId}) จากแท็บแอดมิน`);
            } else if (event.data?.type === 'SYNC_REQUEST') {
              syncCloudEvaluations(true);
            }
          };
        } catch (e) {}

        const handleStorageChange = (e) => {
          if (e.key === 'bafs_evaluations_db') {
            try {
              const updated = e.newValue ? JSON.parse(e.newValue) : {};
              setEvaluations(updated);
            } catch (err) {}
          }
        };
        window.addEventListener('storage', handleStorageChange);

        return () => {
          window.removeEventListener('storage', handleStorageChange);
          if (syncChannelRef.current) {
            syncChannelRef.current.close();
          }
        };
      }, []);

      // Cloud Cross-Platform Two-Way Sync (doGet from Google Apps Script)
      // MASTER SOURCE OF TRUTH: Google Sheets (PotentialEva)
      const syncCloudEvaluations = async (isBackground = false) => {
        if (!webhookUrl) return;
        if (!isBackground) setIsSyncing(true);
        try {
          const res = await fetch(webhookUrl, {
            method: 'GET',
            headers: { 'Accept': 'application/json' }
          });
          if (res.ok) {
            const json = await res.json();
            if (json && json.success && json.payload) {
              const cloudEvals = json.payload.evaluations || {};
              const now = Date.now();

              // REBUILD evaluations directly from Google Sheets (Single Source of Truth)
              // This guarantees that any candidate reset in Google Sheets is removed from the Evaluator screen!
              const freshEvals = {};

              // 1. Populate all active evaluations verified in Google Sheets
              Object.keys(cloudEvals).forEach((candId) => {
                const record = cloudEvals[candId];
                freshEvals[candId] = record;
                if (record.evaluatorId) {
                  freshEvals[`${record.evaluatorId}_${candId}`] = record;
                }
                if (currentUser) {
                  freshEvals[`${currentUser.id}_${candId}`] = record;
                }
                EVALUATORS.forEach((ev) => {
                  freshEvals[`${ev.id}_${candId}`] = record;
                });
              });

              // 2. Protect any in-flight local submission within 15 seconds (anti-race condition)
              Object.keys(pendingSubmissionsRef.current).forEach((candId) => {
                const subTime = pendingSubmissionsRef.current[candId];
                if (now - subTime < 15000 && evaluations[candId]) {
                  freshEvals[candId] = evaluations[candId];
                  if (currentUser) {
                    freshEvals[`${currentUser.id}_${candId}`] = evaluations[candId];
                  }
                } else if (now - subTime >= 15000) {
                  delete pendingSubmissionsRef.current[candId];
                }
              });

              setEvaluations(freshEvals);
              localStorage.setItem('bafs_evaluations_db', JSON.stringify(freshEvals));
              setLastSyncedAt(new Date());

              if (!isBackground) {
                showToast(`ซิงก์ข้อมูลจาก Google Sheets สำเร็จ (${json.payload.count || 0} รายการ)`);
              }
            }
          }
        } catch (err) {
          console.warn('Cloud sync error (fallback to local cache):', err);
          if (!isBackground) {
            showToast('เชื่อมต่อ Google Sheets ไม่สำเร็จ (ใช้งานข้อมูลออฟไลน์)');
          }
        } finally {
          if (!isBackground) setIsSyncing(false);
        }
      };

      // Continuous Cloud Sync: on load, user change, every 30s, and whenever tab becomes active/visible
      useEffect(() => {
        syncCloudEvaluations(true);

        const timer = setInterval(() => {
          syncCloudEvaluations(true);
        }, 30000);

        const onVisibilityChange = () => {
          if (document.visibilityState === 'visible') {
            syncCloudEvaluations(true);
          }
        };

        const onFocus = () => {
          syncCloudEvaluations(true);
        };

        document.addEventListener('visibilitychange', onVisibilityChange);
        window.addEventListener('focus', onFocus);

        return () => {
          clearInterval(timer);
          document.removeEventListener('visibilitychange', onVisibilityChange);
          window.removeEventListener('focus', onFocus);
        };
      }, [webhookUrl, currentUser?.id]);

      // Executive Horizon Motion & Talent Constellation Controller
      useEffect(() => {
        // Toggle Cinematic Horizon Drift on background
        const bgEl = document.getElementById('talent-spotlight-bg');
        if (bgEl) {
          if (currentUser) {
            bgEl.classList.add('has-motion');
          } else {
            bgEl.classList.remove('has-motion');
          }
        }

        // Initialize Talent Constellation Canvas
        const canvas = document.getElementById('talent-constellation-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        let animId;
        let w = (canvas.width = window.innerWidth);
        let h = (canvas.height = window.innerHeight);

        let mouseX = w / 2;
        let mouseY = h / 2;
        let targetX = w / 2;
        let targetY = h / 2;

        const onResize = () => {
          w = canvas.width = window.innerWidth;
          h = canvas.height = window.innerHeight;
        };
        const onMouseMove = (e) => {
          targetX = e.clientX;
          targetY = e.clientY;
        };
        window.addEventListener('resize', onResize);
        window.addEventListener('mousemove', onMouseMove);

        // 38 Talent Nodes
        const nodeCount = 38;
        const nodes = [];
        const colorTiers = [
          'rgba(56, 189, 248, ',  // sky azure
          'rgba(14, 165, 233, ',  // royal blue
          'rgba(245, 158, 11, ',  // champagne gold
          'rgba(241, 245, 249, ', // diamond white
        ];

        for (let i = 0; i < nodeCount; i++) {
          nodes.push({
            x: Math.random() * w,
            y: Math.random() * h,
            radius: Math.random() * 1.1 + 0.7,
            color: colorTiers[Math.floor(Math.random() * colorTiers.length)],
            baseAlpha: Math.random() * 0.32 + 0.15,
            pulseSpeed: Math.random() * 0.025 + 0.012,
            pulseAngle: Math.random() * Math.PI * 2,
            vx: (Math.random() - 0.5) * 0.22,
            vy: (Math.random() - 0.5) * 0.22,
          });
        }

        const render = () => {
          ctx.clearRect(0, 0, w, h);

          // Smooth mouse parallax inertia
          mouseX += (targetX - mouseX) * 0.035;
          mouseY += (targetY - mouseY) * 0.035;
          const parallaxX = (mouseX - w / 2) * 0.022;
          const parallaxY = (mouseY - h / 2) * 0.022;

          // Connecting threads
          for (let i = 0; i < nodes.length; i++) {
            const p1 = nodes[i];
            for (let j = i + 1; j < nodes.length; j++) {
              const p2 = nodes[j];
              const dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
              if (dist < 95) {
                const threadAlpha = 0.04 * (1 - dist / 95);
                ctx.beginPath();
                ctx.moveTo(p1.x + parallaxX, p1.y + parallaxY);
                ctx.lineTo(p2.x + parallaxX, p2.y + parallaxY);
                ctx.strokeStyle = `rgba(56, 189, 248, ${threadAlpha})`;
                ctx.lineWidth = 0.55;
                ctx.stroke();
              }
            }
          }

          // Render nodes
          for (let i = 0; i < nodes.length; i++) {
            const p = nodes[i];
            p.x += p.vx;
            p.y += p.vy;
            p.pulseAngle += p.pulseSpeed;

            if (p.x < 0) p.x = w;
            if (p.x > w) p.x = 0;
            if (p.y < 0) p.y = h;
            if (p.y > h) p.y = 0;

            const alpha = p.baseAlpha + Math.sin(p.pulseAngle) * 0.12;
            ctx.beginPath();
            ctx.arc(p.x + parallaxX, p.y + parallaxY, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color + Math.max(0.06, alpha) + ')';
            ctx.fill();
          }

          animId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', onResize);
          window.removeEventListener('mousemove', onMouseMove);
          cancelAnimationFrame(animId);
        };
      }, [currentUser]);

      // Handle Login (STRICT PASSWORD CHECK)
      const handleLogin = (e) => {
        e.preventDefault();
        setLoginError('');

        const email = emailInput.trim().toLowerCase();
        const pwd = passwordInput.trim();

        const evaluator = EVALUATORS.find(
          (u) => (u.email.toLowerCase() === email || (u.emailAlt && u.emailAlt.toLowerCase() === email))
        );

        if (!evaluator) {
          setLoginError('ไม่พบข้อมูลบัญชีผู้ใช้งานในระบบ');
          return;
        }

        const allowedPasswords = [
          evaluator.password,
          evaluator.password.replace('2026', '2027'),
          evaluator.password.replace('2027', '2026'),
          ...(evaluator.passwords || [])
        ];

        if (!allowedPasswords.includes(pwd)) {
          setLoginError('รหัสผ่านไม่ถูกต้อง กรุณาตรวจสอบและลองใหม่อีกครั้ง');
          return;
        }

        setCurrentUser(evaluator);
        localStorage.setItem('bafs_talent_user', JSON.stringify(evaluator));
        setSelectedHeroIndex(0);
        setAdminViewMode('cinema');
        setEvaluatingCandidate(null);
        setAdminDetailCandidate(null);
        showToast(`ยินดีต้อนรับคุณ ${evaluator.name}`);
      };

      const handleLogout = () => {
        setCurrentUser(null);
        localStorage.removeItem('bafs_talent_user');
        setEmailInput('');
        setPasswordInput('');
        setLoginError('');
        setSelectedHeroIndex(0);
        setAdminViewMode('cinema');
        setEvaluatingCandidate(null);
        setAdminDetailCandidate(null);
      };

      // Strict Admin Permission: ONLY admin@bafs.co.th can view Matrix, edit locked evals, or reset data
      const isSuperAdmin = Boolean(currentUser && currentUser.isAdmin && currentUser.email.toLowerCase() === 'admin@bafs.co.th');

      // Candidates Filtered by Evaluator (Multi-key Matching: by ID, stripped ID, email, and emailAlt)
      const myAssignedCandidates = useMemo(() => {
        if (!currentUser) return [];
        if (isSuperAdmin) return CANDIDATES;

        const currentId = String(currentUser.id || '').toLowerCase().trim();
        const strippedId = currentId.replace(/^eval_/, '');
        const currentEmail = String(currentUser.email || '').toLowerCase().trim();
        const currentEmailAlt = String(currentUser.emailAlt || '').toLowerCase().trim();

        return CANDIDATES.filter((c) => {
          // 1. Check assignedEvaluatorIds (supports both 'kanit' and 'eval_kanit')
          if (c.assignedEvaluatorIds && Array.isArray(c.assignedEvaluatorIds)) {
            const hasIdMatch = c.assignedEvaluatorIds.some((eid) => {
              const idStr = String(eid).toLowerCase().trim();
              return idStr === currentId || idStr === strippedId || idStr.replace(/^eval_/, '') === strippedId;
            });
            if (hasIdMatch) return true;
          }

          // 2. Check evaluator email matching
          if (c.evaluatorEmail) {
            const candEmail = String(c.evaluatorEmail).toLowerCase().trim();
            if (candEmail === currentEmail || (currentEmailAlt && candEmail === currentEmailAlt)) {
              return true;
            }
          }
          if (c.evaluatorEmailAlt) {
            const candEmailAlt = String(c.evaluatorEmailAlt).toLowerCase().trim();
            if (candEmailAlt === currentEmail || (currentEmailAlt && candEmailAlt === currentEmailAlt)) {
              return true;
            }
          }

          // 3. Fallback: department & company match (e.g. Head of AZ -> AZ BAFS)
          if (currentUser.department && c.department && currentUser.company && c.company) {
            if (currentUser.department.toUpperCase() === c.department.toUpperCase() &&
                currentUser.company.toUpperCase() === c.company.toUpperCase()) {
              return true;
            }
          }

          return false;
        });
      }, [currentUser, isSuperAdmin]);

      const focusedCandidate = myAssignedCandidates[selectedHeroIndex] || myAssignedCandidates[0];

      // View Mode Helpers: GUARANTEE that regular evaluators always see the candidate spotlight & reel
      const isCinemaView = !isSuperAdmin || adminViewMode === 'cinema';
      const isMatrixView = isSuperAdmin && adminViewMode === 'matrix';

      // Save Evaluation Handler & Permanent Lock
      const handleSaveEvaluation = async (candidateId, scores, notes) => {
        const existingEval = (evaluations[`${currentUser.id}_${candidateId}`] || evaluations[candidateId]);
        const isAlreadyLocked = Boolean(existingEval && Object.keys(existingEval.scores || {}).length === 12);

        // Strict guard: Evaluators cannot edit locked evaluations. ONLY admin@bafs.co.th can edit.
        if (isAlreadyLocked && !isSuperAdmin) {

          candidateId,
          candidateNo,
          evaluatorId: currentUser.id,
          evaluatorName: currentUser.name,
          evaluatorEmail: currentUser.email,
          scores,
          notes,
          isLocked: true,
          submittedAt: new Date().toISOString()

        // Clear any in-flight pending flag

        // 1. Remove from local state

          const updated = { ...prev };
          delete updated[candidateId];
          Object.keys(updated).forEach((k) => {
            if (k.endsWith(`_${candidateId}`)) {
              delete updated[k];
            }
          });
          localStorage.setItem('bafs_evaluations_db', JSON.stringify(updated));
          return updated;
        });

        // Broadcast to other tabs on same machine immediately
        try {
          if (syncChannelRef.current) {
            syncChannelRef.current.postMessage({ type: 'RESET_SINGLE', candidateId });
          }
        } catch (e) {}

        showToast(`กำลังรีเซ็ตผลการประเมินของ ${candName}...`);

        // 2. Send Reset action to Google Apps Script Webhook
        if (webhookUrl) {
          try {
            await fetch(webhookUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },

                action: 'reset',

                          title="คลิกเพื่อดูรายละเอียดผลการประเมินที่ส่งแล้ว"
                        >
                          <svg className="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                          </svg>
                          <span>🔒 ส่งผลประเมินแล้ว (ระบบล็อค)</span>
                        </button>
                      ) : isFocusedDone && isSuperAdmin ? (
                        <>
                          <button
                            onClick={() => setEvaluatingCandidate(focusedCandidate)}
                            className="px-6 py-3.5 rounded-full bg-gradient-to-r from-amber-400 via-amber-300 to-amber-400 hover:from-amber-300 hover:via-amber-200 hover:to-yellow-300 text-slate-950 font-black text-xs sm:text-sm shadow-[0_0_25px_rgba(245,158,11,0.5)] transition-all flex items-center gap-2 cursor-pointer"
                          >
                            <svg className="w-4 h-4 text-slate-950" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                            </svg>
                            <span>ดู / แก้ไขการประเมิน (Admin)</span>
                          </button>

                          <button
                            onClick={() => handleResetEvaluation(focusedCandidate.id)}
                            className="px-5 py-3.5 rounded-full bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-400/50 font-black text-xs sm:text-sm transition-all flex items-center gap-2 cursor-pointer shadow-sm"
                            title="รีเซ็ตคะแนนท่านนี้ใน Google Sheets เพื่อทดสอบใหม่"
                          >
                            <svg className="w-4 h-4 text-rose-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                            <span>รีเซ็ตคะแนน (Admin)</span>
                          </button>
                        </>
                      ) : (
                        <button
                          onClick={() => setEvaluatingCandidate(focusedCandidate)}
                          className="px-8 py-4 rounded-full bg-gradient-to-r from-amber-400 via-amber-300 to-amber-400 hover:from-amber-300 hover:via-amber-200 hover:to-yellow-300 text-slate-950 font-black text-sm sm:text-base shadow-[0_0_35px_rgba(245,158,11,0.55)] hover:shadow-[0_0_50px_rgba(245,158,11,0.75)] transition-all transform active:scale-95 flex items-center gap-3 cursor-pointer"
                        >
                          <svg className="w-5 h-5 text-slate-950 font-black" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z"/>
                          </svg>
                          <span>เริ่มการประเมินศักยภาพ</span>
                        </button>
                      )}

                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => setSelectedHeroIndex(prev => Math.max(0, prev - 1))}
                          disabled={selectedHeroIndex === 0}
                          className="w-12 h-12 rounded-full bg-slate-950/80 backdrop-blur-md border border-white/25 flex items-center justify-center text-slate-100 hover:text-white hover:border-amber-400 hover:bg-slate-900 disabled:opacity-30 disabled:cursor-not-allowed transition-all cursor-pointer shadow-lg"
                          title="ผู้รับการประเมินท่านก่อนหน้า"
                        >
                          <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M15 19l-7-7 7-7" />
                          </svg>
                        </button>

                        <button
                          onClick={() => setSelectedHeroIndex(prev => Math.max(0, Math.min(myAssignedCandidates.length - 1, prev + 1)))}
                          disabled={selectedHeroIndex === myAssignedCandidates.length - 1}
                          className="w-12 h-12 rounded-full bg-slate-950/80 backdrop-blur-md border border-white/25 flex items-center justify-center text-slate-100 hover:text-white hover:border-amber-400 hover:bg-slate-900 disabled:opacity-30 disabled:cursor-not-allowed transition-all cursor-pointer shadow-lg"
                          title="ผู้รับการประเมินท่านถัดไป"
                        >
                          <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M9 5l7 7-7 7" />
                          </svg>
                        </button>
                      </div>
                    </div>

                    {isFocusedDone && !isSuperAdmin && (
                      <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-xl bg-amber-950/70 border border-amber-400/40 text-[11px] font-medium text-amber-200/90 shadow-sm backdrop-blur-md">
                        <span className="text-amber-400">ℹ️</span>
                        <span>ผลการประเมินถูกส่งเข้าระบบแล้ว ไม่สามารถแก้ไขได้ หากต้องการแก้ไขกรุณาติดต่อทีมงาน HOD</span>
                      </div>
                    )}
                  </div>

                </div>
              ) : (
                <div className="p-8 rounded-3xl liquid-glass text-center space-y-3">
                  <p className="text-sm text-slate-300">ไม่พบรายชื่อผู้รับการประเมินที่ผูกกับบัญชีนี้</p>
                </div>
              )}
            </main>
          )}

          {/* ========================================================= */}
          {/* ADMIN MATRIX / UAT TABLE VIEW                             */}
          {/* ========================================================= */}
          {isMatrixView && (
            <main className="relative z-10 flex-1 px-4 sm:px-8 py-6 max-w-7xl mx-auto w-full overflow-y-auto custom-scroll">
              <div className="space-y-5">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <h2 className="text-xl font-black text-white">ภาพรวมผลการประเมินศักยภาพ ({CANDIDATES.length} ท่าน)</h2>
                    <p className="text-xs text-slate-300">
                      ตรวจสอบคะแนน, ดูผลการวิเคราะห์ระดับศักยภาพ และสามารถรีเซ็ตข้อมูลเพื่อทดสอบใหม่ได้
                    </p>
                  </div>
                  <div className="flex items-center gap-3">
                    <button
                      onClick={handleResetAllEvaluations}
                      className="px-4 py-2 rounded-xl bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-400/40 text-xs font-bold transition-all cursor-pointer flex items-center gap-2 shadow-sm"
                      title={`ล้างคะแนนทั้งหมด ${CANDIDATES.length} ท่านใน Google Sheets เพื่อทดสอบระบบใหม่`}
                    >
                      <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                      </svg>
                      <span>⚠️ รีเซ็ตข้อมูลทั้งหมด (Admin Reset)</span>
                    </button>
                    <button
                      onClick={() => setAdminViewMode('cinema')}
                      className="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/15 text-xs font-bold text-white cursor-pointer"
                    >
                      กลับสู่โหมดสปอตไลต์
                    </button>
                  </div>
                </div>

                <div className="rounded-3xl liquid-glass border border-white/20 overflow-hidden shadow-2xl">
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-white/[0.04] text-slate-300 border-b border-white/10 font-bold uppercase tracking-wider">
                        <tr>
                          <th className="p-4">ผู้รับการประเมิน</th>
                          <th className="p-4">บริษัท/ฝ่าย</th>
                          <th className="p-4">สถานะ</th>
                          <th className="p-4 text-center">คะแนนรวม</th>
                          <th className="p-4 text-center">ระดับศักยภาพ</th>
                          <th className="p-4 text-right">การจัดการ</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-white/5">
                        {CANDIDATES.map((cand) => {
                          const evalKey = `${currentUser.id}_${cand.id}`;
                          const ev = evaluations[evalKey] || evaluations[cand.id];
                          const isDone = Boolean(ev && Object.keys(ev.scores || {}).length === 12);
                          const stats = isDone ? calculateScore(ev.scores) : null;

                          return (
                            <tr key={cand.id} className="hover:bg-white/[0.03] transition-colors">
                              <td className="p-4">
                                <div className="font-bold text-white text-sm">{cand.fullName}</div>
                                <div className="text-[11px] text-slate-400">อายุ {cand.age} ปี • อายุงาน {cand.serviceYears} ปี</div>
                              </td>
                              <td className="p-4 whitespace-nowrap">
                                <span className="font-semibold text-slate-200">{cand.company}</span> • <span className="text-amber-300 font-bold">{cand.department}</span>
                              </td>
                              <td className="p-4">
                                {isDone ? (
                                  <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-400/40 text-[11px] font-bold">
                                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                                    เสร็จสมบูรณ์
                                  </span>
                                ) : (
                                  <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-400/40 text-[11px] font-bold">
                                    <span className="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
                                    รอการประเมิน
                                  </span>
                                )}
                              </td>
                              <td className="p-4 text-center">
                                {stats ? (
                                  <span className="font-bold text-amber-300 text-sm">{stats.rawScore} / 60</span>
                                ) : (
                                  <span className="text-slate-500">—</span>
                                )}
                              </td>
                              <td className="p-4 text-center">
                                {stats ? (
                                  <span className={`inline-block px-2 py-0.5 rounded-md text-[10px] font-bold border ${stats.tierColor}`}>
                                    {stats.potentialTier}
                                  </span>
                                ) : (
                                  <span className="text-slate-500">—</span>
                                )}
                              </td>
                              <td className="p-4 text-right space-x-2">
                                {isDone && (
                                  <>
                                    <button
                                      onClick={() => setAdminDetailCandidate({ candidate: cand, evaluation: ev })}
                                      className="px-3 py-1 rounded-lg bg-blue-500/20 hover:bg-blue-500/30 text-blue-300 border border-blue-400/40 text-xs font-semibold cursor-pointer"
                                    >
                                      ดูผลลัพธ์
                                    </button>
                                    <button
                                      onClick={() => handleResetEvaluation(cand.id)}
                                      className="px-3 py-1 rounded-lg bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-400/40 text-xs font-semibold cursor-pointer"
                                      title="รีเซ็ตคะแนนท่านนี้ใน Google Sheets เพื่อทดสอบใหม่"
                                    >
                                      รีเซ็ตคะแนน
                                    </button>
                                  </>
                                )}
                                <button
                                  onClick={() => setEvaluatingCandidate(cand)}
                                  className="px-3 py-1 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-400/40 text-xs font-bold cursor-pointer"
                                >
                                  {isDone ? 'แก้ไข' : 'ประเมิน'}
                                </button>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </main>
          )}

          {/* ========================================================= */}
          {/* BOTTOM ROW: CANDIDATE REEL (ADAPTIVE GRID - ZERO OVERFLOW) */}
          {/* ========================================================= */}
          {isCinemaView && (
            <footer className="relative z-20 px-4 sm:px-8 py-5 border-t border-white/15 bg-slate-950/80 backdrop-blur-2xl shadow-2xl">
              <div className="max-w-7xl mx-auto space-y-3">
                <div className="flex items-center justify-between text-xs">
                  <div className="font-bold text-slate-200 flex items-center gap-2">
                    <span>รายชื่อผู้รับการประเมินในความรับผิดชอบ</span>
                    <span className="px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-400/40 font-mono font-bold">
                      {myAssignedCandidates.filter(c => {
                        const ev = evaluations[`${currentUser.id}_${c.id}`] || evaluations[c.id];
                        return Boolean(ev && Object.keys(ev.scores || {}).length === 12);
                      }).length} / {myAssignedCandidates.length} เสร็จสิ้น
                    </span>
                  </div>
                  <div className="text-slate-400 text-[11px] hidden sm:inline">
                    คลิกการ์ดเพื่อสลับสปอตไลต์ หรือเริ่มการประเมิน
                  </div>
                </div>

                {/* Candidate Cards: Adaptive Grid for <= 4 candidates, Scroll reel for > 4 candidates */}
                {myAssignedCandidates.length <= 4 ? (
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5 w-full pt-1">
                    {myAssignedCandidates.map((cand, idx) => {
                      const isSelected = selectedHeroIndex === idx;
                      const evalKey = `${currentUser.id}_${cand.id}`;
                      const ev = evaluations[evalKey] || evaluations[cand.id];
                      const isDone = Boolean(ev && Object.keys(ev.scores || {}).length === 12);

                      return (
                        <div
                          key={cand.id}
                          onClick={() => setSelectedHeroIndex(idx)}
                          className={`w-full p-3.5 rounded-2xl cursor-pointer transition-all duration-300 flex items-center justify-between gap-3 border shadow-md ${
                            isSelected
                              ? 'bg-slate-950/95 border-amber-400 ring-2 ring-amber-400/70 shadow-[0_0_30px_rgba(245,158,11,0.4)] scale-[1.02]'
                              : 'bg-slate-950/85 hover:bg-slate-900/95 border-white/20 hover:border-amber-400/60'
                          }`}
                        >
                          <div className="flex items-center gap-3 overflow-hidden min-w-0">
                            <div className={`w-10 h-10 rounded-xl flex items-center justify-center font-bold text-white text-xs flex-shrink-0 border ${
                              cand.company === 'BAFS' ? 'bg-gradient-to-br from-blue-700 to-blue-950 border-blue-400/40' : 'bg-gradient-to-br from-teal-600 to-teal-950 border-teal-400/40'
                            }`}>
                              {cand.company}
                            </div>

                            <div className="overflow-hidden min-w-0">
                              <div className="text-[10px] font-bold text-amber-300 uppercase tracking-wide truncate whitespace-nowrap">
                                {cand.department} • {cand.company}
                              </div>
                              <h4 className="text-xs sm:text-sm font-black text-white truncate whitespace-nowrap">
                                {cand.fullName}
                              </h4>
                              <p className="text-[11px] text-slate-400 font-medium truncate whitespace-nowrap">
                                อายุ {cand.age} ปี • อายุงาน {cand.serviceYears} ปี
                              </p>
                            </div>
                          </div>

                          <div className="flex-shrink-0">
                            {isDone ? (
                              <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 inline-block shadow-[0_0_8px_rgba(52,211,153,0.8)]" title="ประเมินเรียบร้อย"></span>
                            ) : (
                              <span className="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block animate-pulse shadow-[0_0_8px_rgba(251,191,36,0.8)]" title="รอการประเมิน"></span>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                ) : (
                  <div className="flex items-center gap-3.5 overflow-x-auto reel-scroll pb-2 pt-1 pr-8">
                    {myAssignedCandidates.map((cand, idx) => {
                      const isSelected = selectedHeroIndex === idx;
                      const evalKey = `${currentUser.id}_${cand.id}`;
                      const ev = evaluations[evalKey] || evaluations[cand.id];
                      const isDone = Boolean(ev && Object.keys(ev.scores || {}).length === 12);

                      return (
                        <div
                          key={cand.id}
                          onClick={() => setSelectedHeroIndex(idx)}
                          className={`min-w-[240px] sm:min-w-[270px] p-3.5 rounded-2xl cursor-pointer transition-all duration-300 flex items-center justify-between gap-3 border flex-shrink-0 shadow-md ${
                            isSelected
                              ? 'bg-slate-950/95 border-amber-400 ring-2 ring-amber-400/70 shadow-[0_0_30px_rgba(245,158,11,0.4)] scale-[1.02]'
                              : 'bg-slate-950/85 hover:bg-slate-900/95 border-white/20 hover:border-amber-400/60'
                          }`}
                        >
                          <div className="flex items-center gap-3 overflow-hidden min-w-0">
                            <div className={`w-10 h-10 rounded-xl flex items-center justify-center font-bold text-white text-xs flex-shrink-0 border ${
                              cand.company === 'BAFS' ? 'bg-gradient-to-br from-blue-700 to-blue-950 border-blue-400/40' : 'bg-gradient-to-br from-teal-600 to-teal-950 border-teal-400/40'
                            }`}>
                              {cand.company}
                            </div>

                            <div className="overflow-hidden min-w-0">
                              <div className="text-[10px] font-bold text-amber-300 uppercase tracking-wide truncate whitespace-nowrap">
                                {cand.department} • {cand.company}
                              </div>
                              <h4 className="text-xs sm:text-sm font-black text-white truncate whitespace-nowrap">
                                {cand.fullName}
                              </h4>
                              <p className="text-[11px] text-slate-400 font-medium truncate whitespace-nowrap">
                                อายุ {cand.age} ปี • อายุงาน {cand.serviceYears} ปี
                              </p>
                            </div>
                          </div>

                          <div className="flex-shrink-0">
                            {isDone ? (
                              <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 inline-block shadow-[0_0_8px_rgba(52,211,153,0.8)]" title="ประเมินเรียบร้อย"></span>
                            ) : (
                              <span className="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block animate-pulse shadow-[0_0_8px_rgba(251,191,36,0.8)]" title="รอการประเมิน"></span>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </footer>
          )}

          {/* ========================================================= */}
          {/* MODALS LAYER                                              */}
          {/* ========================================================= */}
          {evaluatingCandidate && (
            <AssessmentModal
              candidate={evaluatingCandidate}
              initialEvaluation={evaluations[`${currentUser.id}_${evaluatingCandidate.id}`] || evaluations[evaluatingCandidate.id]}
              isLocked={Boolean(
                (evaluations[`${currentUser.id}_${evaluatingCandidate.id}`] || evaluations[evaluatingCandidate.id]) &&
                Object.keys((evaluations[`${currentUser.id}_${evaluatingCandidate.id}`] || evaluations[evaluatingCandidate.id]).scores || {}).length === 12
              )}
              isAdmin={isSuperAdmin}
              onSave={handleSaveEvaluation}
              onReset={() => handleResetEvaluation(evaluatingCandidate.id)}
              onClose={() => setEvaluatingCandidate(null)}
            />
          )}

          {adminDetailCandidate && (
            <AdminCandidateDetailModal
              candidate={adminDetailCandidate.candidate}
              evaluation={adminDetailCandidate.evaluation}
              onClose={() => setAdminDetailCandidate(null)}
            />
          )}


          {/* Floating Toast Notification */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 p-4 rounded-2xl bg-slate-900/95 border border-amber-400/60 shadow-2xl text-white text-xs font-bold flex items-center gap-3 animate-blur-fade-up">
              <span className="text-amber-400 text-base">✨</span>
              <span>{toastMessage}</span>
            </div>
          )}

        </div>
      );
    }

    // Mount Application
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
